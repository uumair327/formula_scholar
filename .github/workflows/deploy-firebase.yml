###############################################################################
# Formula Scholar — Firebase Hosting Deploy
# ─────────────────────────────────────────
# Triggers on push to main; builds Flutter Web and deploys to Firebase Hosting.
#
# Required GitHub Secrets:
#   FIREBASE_SERVICE_ACCOUNT       — Full JSON of Firebase service account key
#   FIREBASE_PROJECT_ID            — Firebase project ID (e.g. "formula-scholar")
#   FIREBASE_API_KEY_WEB           — Web API key (AIza...)
#   FIREBASE_APP_ID_WEB            — Web App ID (1:908...:web:...)
#   FIREBASE_MESSAGING_SENDER_ID   — Messaging Sender ID (908...)
#   FIREBASE_AUTH_DOMAIN            — Auth domain (project.firebaseapp.com)
#   FIREBASE_STORAGE_BUCKET         — Storage bucket (project.firebasestorage.app)
#   FIREBASE_MEASUREMENT_ID         — Analytics measurement ID (G-XXXXXXXXXX)
#   GOOGLE_WEB_CLIENT_ID            — Google OAuth Web Client ID
###############################################################################

name: Deploy Flutter Web → Firebase

on:
  push:
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Prevent concurrent deploys to the same environment
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Flutter SDK ───────────────────────────────────────────────
      - name: Set up Flutter (${{ env.FLUTTER_CHANNEL }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      # ── Generate firebase_options.dart from secrets ────────────────
      # This file is gitignored. CI must regenerate it at build time.
      - name: Generate firebase_options.dart
        run: |
          cat > lib/firebase_options.dart << 'DART_EOF'
          // File generated by CI pipeline — DO NOT EDIT MANUALLY.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY_WEB }}',
              appId: '${{ secrets.FIREBASE_APP_ID_WEB }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              measurementId: '${{ secrets.FIREBASE_MEASUREMENT_ID }}',
            );

            // Android/iOS configs not needed for web build,
            // but included to keep the class complete.
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY_WEB }}',
              appId: '${{ secrets.FIREBASE_APP_ID_WEB }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY_WEB }}',
              appId: '${{ secrets.FIREBASE_APP_ID_WEB }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            );
          }
          DART_EOF
          echo "✅ firebase_options.dart generated from secrets"

      # ── Dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Build ─────────────────────────────────────────────────────
      - name: Build Flutter Web (release)
        run: flutter build web --release --web-renderer html

      # ── Firebase Deploy ───────────────────────────────────────────
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
