name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true

      - name: Verify Environment
        run: flutter doctor -v

      # firebase_options.dart is gitignored. Generate a stub for CI
      # analysis/tests (values don't matter — only structure does).
      - name: Generate firebase_options.dart stub
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format lib bin scripts test

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
