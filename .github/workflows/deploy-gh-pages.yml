###############################################################################
# Formula Scholar — GitHub Pages Deploy
# ──────────────────────────────────────
# Builds Flutter Web with the correct base-href and deploys to GitHub Pages.
# Serves at: https://uumair327.github.io/formula_scholar/
#
# Required GitHub Secrets:
#   FIREBASE_API_KEY_WEB           — Web API key (AIza...)
#   FIREBASE_APP_ID_WEB            — Web App ID (1:908...:web:...)
#   FIREBASE_MESSAGING_SENDER_ID   — Messaging Sender ID
#   FIREBASE_PROJECT_ID            — Firebase project ID
#   FIREBASE_AUTH_DOMAIN            — Auth domain
#   FIREBASE_STORAGE_BUCKET         — Storage bucket
#   FIREBASE_MEASUREMENT_ID         — Analytics measurement ID
#   GOOGLE_WEB_CLIENT_ID            — Google OAuth Web Client ID
###############################################################################

name: Deploy Flutter Web → GitHub Pages

on:
  push:
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Prevent concurrent deploys
concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  FLUTTER_CHANNEL: stable
  BASE_HREF: /formula_scholar/

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Flutter SDK ───────────────────────────────────────────────
      - name: Set up Flutter (${{ env.FLUTTER_CHANNEL }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # ── Generate firebase_options.dart from secrets ────────────────
      # This file is gitignored. CI must regenerate it at build time.
      - name: Generate firebase_options.dart
        run: |
          cat > lib/firebase_options.dart << 'DART_EOF'
          // File generated by CI pipeline — DO NOT EDIT MANUALLY.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY_WEB }}',
              appId: '${{ secrets.FIREBASE_APP_ID_WEB }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              measurementId: '${{ secrets.FIREBASE_MEASUREMENT_ID }}',
            );

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY_WEB }}',
              appId: '${{ secrets.FIREBASE_APP_ID_WEB }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_API_KEY_WEB }}',
              appId: '${{ secrets.FIREBASE_APP_ID_WEB }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            );
          }
          DART_EOF
          echo "✅ firebase_options.dart generated from secrets"

      # ── Dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Build ─────────────────────────────────────────────────────
      - name: Build Flutter Web (release, with base-href)
        run: flutter build web --release --web-renderer html --base-href "${{ env.BASE_HREF }}"

      # ── 404 → SPA fallback ────────────────────────────────────────
      # GitHub Pages returns 404.html for unknown paths.
      # Copy index.html so client-side routing takes over.
      - name: Create 404.html fallback for SPA routing
        run: cp build/web/index.html build/web/404.html

      # ── Upload Pages artifact ─────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
